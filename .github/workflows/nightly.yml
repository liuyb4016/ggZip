name: Nightly

# 每天北京时间 05:00 自动构建 main 并发布 nightly 预发布版本；
# 自最近一次 nightly 以来没有新提交时自动跳过。
on:
  schedule:
    - cron: '0 21 * * *'   # UTC 21:00 = 北京时间 05:00
  workflow_dispatch:
    inputs:
      force:
        description: '无新提交时也强制构建发布'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  gate:
    name: 检查是否有新提交
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
      date: ${{ steps.meta.outputs.date }}
    steps:
      - name: 计算日期（北京时间）
        id: meta
        run: echo "date=$(TZ=Asia/Shanghai date +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: 与最近一次 nightly 比较
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "手动触发且 force=true，直接构建"
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '[.[] | select(.tag_name | startswith("nightly-"))][0].target_commitish // ""')"
          if [ -n "$last" ] && [ "$last" = "${{ github.sha }}" ]; then
            echo "自最近一次 nightly 以来没有新提交，跳过本次构建"
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

  packages:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    uses: ./.github/workflows/package.yml
    with:
      package_name: ggZip-nightly-${{ needs.gate.outputs.date }}-win64

  nightly:
    name: 发布完整 nightly
    needs: [gate, packages]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ggzip-windows-packages
          path: packages
      - name: 验证产物校验和
        working-directory: packages
        run: sha256sum --check *-SHA256SUMS.txt

      - name: 发布 nightly Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DATE: ${{ needs.gate.outputs.date }}
        run: |
          TAG="nightly-$DATE"
          # 同日重跑（如手动强制触发）时先删除旧发布和标签
          gh release view "$TAG" >/dev/null 2>&1 && gh release delete "$TAG" --yes --cleanup-tag
          {
            echo "### ggZip 夜间构建"
            echo
            echo "- 提交：${GITHUB_SHA:0:7} $(git log -1 --pretty=%s)"
            echo "- 产物：完整便携包、安装包、SHA256 校验和（内置 7-Zip 引擎与 SFX 模块）"
            echo "- 构建：MSVC x64 Release，核心/文件关联/Shell E2E/安装升级卸载测试通过"
            echo "- 时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M')（北京时间）"
            echo
            echo "每天北京时间 05:00 自动构建 main 分支；有新提交才会发布新版本。"
          } > notes.md
          gh release create "$TAG" packages/*.zip packages/*-setup.exe packages/*-SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "ggZip nightly $DATE" --notes-file notes.md --prerelease
