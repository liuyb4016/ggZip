name: Windows Packages

on:
  workflow_call:
    inputs:
      package_name:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        shell: pwsh
        run: |
          python -m pip install --quiet aqtinstall==3.3.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m aqt install-qt windows desktop 6.9.3 win64_msvc2022_64 -m qtimageformats -O "$env:GITHUB_WORKSPACE\Qt"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare pinned Inno Setup compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path tools -Force | Out-Null
          $archive = "$env:GITHUB_WORKSPACE\tools\innosetup.zip"
          Invoke-WebRequest -Uri 'https://api.nuget.org/v3-flatcontainer/tools.innosetup/6.7.3/tools.innosetup.6.7.3.nupkg' -OutFile $archive
          $expectedHash = 'F780898E402FF80612CC8D9FCB8C6E02932BD1CB4C900FFDAA31F9341CFB49F4'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash -ne $expectedHash) {
            throw 'Inno Setup package checksum mismatch.'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath tools\InnoSetup
          $compiler = "$env:GITHUB_WORKSPACE\tools\InnoSetup\tools\ISCC.exe"
          if (-not (Test-Path -LiteralPath $compiler)) { throw 'Inno Setup compiler was not found.' }
          if ((Get-AuthenticodeSignature -FilePath $compiler).Status -ne 'Valid') {
            throw 'Inno Setup compiler signature is invalid.'
          }
          "GGZIP_ISCC=$compiler" >> $env:GITHUB_ENV

      - name: Build, test, and package
        shell: pwsh
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          .\packaging\build.ps1 -QtDir "$env:GITHUB_WORKSPACE\Qt\6.9.3\msvc2022_64" `
            -IsccPath $env:GGZIP_ISCC -PackageName $env:PACKAGE_NAME -RunShellTests

      - name: Installer integration test
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out\packages\*-setup.exe -File)
          if ($installers.Count -ne 1) { throw 'Expected exactly one installer.' }
          .\packaging\test-installer.ps1 -InstallerPath $installers[0].FullName

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ggzip-windows-packages
          path: |
            out/packages/*.zip
            out/packages/*-setup.exe
            out/packages/*-SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload installer diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ggzip-installer-diagnostics
          path: ${{ runner.temp }}/ggzip-install-*/*.log
          if-no-files-found: ignore
