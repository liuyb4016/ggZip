name: GUI CI

on:
  push:
    paths:
      - "gui/**"
      - "core/**"
      - "cli/**"
      - "shell/**"
      - "tests/**"
      - "packaging/**"
      - "cmake/**"
      - "VERSION"
      - "CMakeLists.txt"
      - ".github/workflows/gui.yml"
      - ".github/workflows/package.yml"
  pull_request:
    paths:
      - "gui/**"
      - "core/**"
      - "cli/**"
      - "shell/**"
      - "tests/**"
      - "packaging/**"
      - "cmake/**"
      - "VERSION"
      - "CMakeLists.txt"
      - ".github/workflows/gui.yml"
      - ".github/workflows/package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-gui:
    uses: ./.github/workflows/package.yml
