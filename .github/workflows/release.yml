name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "$TAG" != "v$version" ]; then
            echo "The tag must match VERSION (v$version), got $TAG" >&2
            exit 1
          fi

  packages:
    needs: validate
    uses: ./.github/workflows/package.yml
    with:
      package_name: ggZip-${{ github.ref_name }}-win64

  publish:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ggzip-windows-packages
          path: packages
      - name: Verify package checksums
        working-directory: packages
        run: sha256sum --check *-SHA256SUMS.txt
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" packages/*.zip packages/*-setup.exe packages/*-SHA256SUMS.txt \
            --verify-tag --title "ggZip $TAG" --generate-notes
