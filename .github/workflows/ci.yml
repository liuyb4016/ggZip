name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # 不指定 -G：让 CMake 在 runner 上自动选择已安装的最新版 Visual Studio 生成器
        run: cmake -S . -B build -A x64 -DGGZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare pinned 7-Zip engine
        shell: pwsh
        run: |
          $engine = .\packaging\prepare-engine.ps1
          "GGZIP_7Z=$($engine.Directory)\7z.exe" >> $env:GITHUB_ENV

      - name: Smoke test
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Isolated FAT32 and exFAT transactions and disk-full recovery
        shell: pwsh
        run: |
          .\packaging\test-filesystems.ps1 -TestExecutable .\build\tests\Release\ggzip_cross_volume_test.exe

      - name: Record bounded archive performance
        shell: pwsh
        run: |
          .\packaging\test-performance.ps1 -BuildDir build -OutputDir out\performance-ci-core `
            -LargeMiB 64 -SmallFiles 1000 -Iterations 2

      - name: Upload archive performance reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ggzip-archive-performance
          path: out/performance-ci-core/*.json
          if-no-files-found: warn
          retention-days: 14

  windows-msvc-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Shell 扩展为独立工程（shell/），不并入根 CMakeLists
        run: cmake -S shell -B build-shell -A x64

      - name: Build
        run: cmake --build build-shell --config Release

      - name: Shell host test
        shell: pwsh
        # 干跑模式：不需要 7-Zip 与 ggz.exe（GGZIP_SHELL_DRYRUN 钩子）
        run: |
          & .\build-shell\Release\shell_host_test.exe "$PWD\build-shell\Release\ggzip_shell.dll" "C:\fake\ggz.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
