name: CI

on:
  push:
  pull_request:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # 不指定 -G：让 CMake 在 runner 上自动选择已安装的最新版 Visual Studio 生成器
        run: cmake -S . -B build -A x64 -DGGZ_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Smoke test
        shell: pwsh
        env:
          GGZIP_7Z: C:\Program Files\7-Zip\7z.exe
        run: |
          & .\build\tests\Release\ggzip_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  windows-msvc-shell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Shell 扩展为独立工程（shell/），不并入根 CMakeLists
        run: cmake -S shell -B build-shell -A x64

      - name: Build
        run: cmake --build build-shell --config Release

      - name: Shell host test
        shell: pwsh
        # 干跑模式：不需要 7-Zip 与 ggz.exe（GGZIP_SHELL_DRYRUN 钩子）
        run: |
          & .\build-shell\Release\shell_host_test.exe "$PWD\build-shell\Release\ggzip_shell.dll" "C:\fake\ggz.exe"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
